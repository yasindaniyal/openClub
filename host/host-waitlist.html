<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waitlist | OpenClub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/host.css" />

    <style>
      .dashboard-table-header.waitlist-table-header {
        grid-template-columns: 1.5fr 1fr 1fr 1fr 1.5fr;
      }

      .dashboard-table-row.waitlist-table-row {
        grid-template-columns: 1.5fr 1fr 1fr 1fr 1.5fr;
      }
      .waitlist-cta-wrapper {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .waitlist-seat-btn {
        padding: 10px 20px;
      }
      .btn-outline-primary {
        background-color: var(--color-bg-card-light);
        border: 1px solid var(--color-border);
        border-radius: 50px;
        color: var(--color-text);
        cursor: pointer;
        transition:
          background 0.2s,
          color 0.2s;
        font-family: var(--font-heading);
      }
      .btn-outline-primary:hover,
      .btn-outline-primary:focus,
      .btn-outline-primary:active,
      .btn-outline-primary:active:focus {
        background-color: var(--color-primary);
        border-color: var(--color-accent);
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <main class="open-club container-fluid p-0">
      <div class="sidebar-wrapper">
        <nav id="sidebar" class="sidebar-section">
          <div class="sidebar d-flex flex-column h-100">
            <div class="logo mb-4">
              <a href="../index.html">
                <img
                  src="../assets/images/logo.png"
                  class="img-fluid"
                  alt="Logo"
                />
              </a>
            </div>
            <p class="sidebar-eyebrow">Menu</p>
            <ul class="sidebar-menu nav flex-column flex-grow-1 gap-2">
              <li class="nav-list nav-item">
                <a
                  class="nav-link d-flex align-items-center"
                  href="host-dashboard.html"
                >
                  <div class="btn-wrapper me-2">
                    <img src="../assets/images/Dashboard.png" alt="" />
                  </div>
                  <p class="m-0 link-text">Dashboard</p>
                </a>
              </li>
              <li class="nav-list nav-item">
                <a
                  class="nav-link d-flex align-items-center"
                  href="host-guest-list.html"
                >
                  <div class="btn-wrapper me-2">
                    <img src="../assets/images/guest-list.png" alt="" />
                  </div>
                  <p class="m-0 link-text">Guest List</p>
                </a>
              </li>
              <li class="nav-list nav-item">
                <a
                  class="nav-link d-flex align-items-center"
                  href="host-floor-plan.html"
                >
                  <div class="btn-wrapper me-2">
                    <img src="../assets/images/LiveFloor.png" alt="" />
                  </div>
                  <p class="m-0 link-text">Floor View</p>
                </a>
              </li>
              <li class="nav-list nav-item active">
                <a
                  class="nav-link d-flex align-items-center"
                  href="host-waitlist.html"
                >
                  <div class="btn-wrapper me-2">
                    <img
                      src="../assets/images/clock.png"
                      style="width: 20px"
                      alt=""
                    />
                  </div>
                  <p class="m-0 link-text active">Waitlist</p>
                </a>
              </li>
              <li class="nav-list nav-item">
                <a
                  class="nav-link d-flex align-items-center"
                  href="host-reservations.html"
                >
                  <div class="btn-wrapper me-2">
                    <img src="../assets/images/host-reservations.png" alt="" />
                  </div>
                  <p class="m-0 link-text">Reservations</p>
                </a>
              </li>
              <li class="nav-list nav-item">
                <a
                  class="nav-link d-flex align-items-center"
                  href="host-scanner.html"
                >
                  <div class="btn-wrapper me-2">
                    <img src="../assets/images/Scanner.png" alt="" />
                  </div>
                  <p class="m-0 link-text">Scanner</p>
                </a>
              </li>
            </ul>

            <div class="sidebar-user-card mt-auto">
              <div
                class="sidebar-user-profile"
                onclick="window.location.href = '../edit-profile.html'"
                style="cursor: pointer"
              >
                <div class="sidebar-user-avatar">YD</div>
                <div class="sidebar-user-info">
                  <p class="sidebar-user-name">Yasin Daniyal</p>
                  <p class="sidebar-user-post">Host</p>
                </div>
              </div>
              <button
                class="sidebar-logout-btn"
                onclick="window.location.href = '../login.html'"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
              </button>
            </div>
          </div>
        </nav>
      </div>

      <section class="dashboard">
        <div class="search-bar-wrapper">
          <div class="search-bar-content">
            <input
              type="text"
              id="waitlist-search"
              placeholder="Search waitlist..."
            />
          </div>
          <div class="d-flex align-items-center gap-3 notification-wrapper">
            <button
              class="btn btn-live"
              onclick="alert('Add to waitlist coming soon')"
            >
              + Add to Waitlist
            </button>
          </div>
        </div>
      </section>

      <section class="content">
        <div class="title-wrapper">
          <h1 class="title">Waitlist</h1>
          <p class="subtitle">Managing pending arrivals and walk-ins.</p>
        </div>

        <div class="dashboard-bottom-grid">
          <div class="dashboard-table">
            <div class="table-responsive">
              <div class="dashboard-table-header waitlist-table-header">
                <div
                  class="dashboard-table-header-cell waitlist-table-header-cell"
                >
                  Party Name
                </div>
                <div
                  class="dashboard-table-header-cell waitlist-table-header-cell"
                >
                  Size
                </div>
                <div
                  class="dashboard-table-header-cell waitlist-table-header-cell"
                >
                  Wait Time
                </div>
                <div
                  class="dashboard-table-header-cell waitlist-table-header-cell"
                >
                  Status
                </div>
                <div
                  class="dashboard-table-header-cell waitlist-table-header-cell text-center"
                >
                  Actions
                </div>
              </div>
              <div id="waitlist-content">
                <!-- Populated by JS -->
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      // ── Data ──────────────────────────────────────────────────────────────────
      const waitlistData = [
        { id: 1, name: "John Doe", size: 4, waitMins: 15, status: "Waiting" },
        { id: 2, name: "Jane Smith", size: 2, waitMins: 5, status: "Waiting" },
        {
          id: 3,
          name: "Marcus Lee",
          size: 6,
          waitMins: 22,
          status: "Notified",
        },
        {
          id: 4,
          name: "Priya Sharma",
          size: 3,
          waitMins: 8,
          status: "Waiting",
        },
        {
          id: 5,
          name: "Carlos Ruiz",
          size: 5,
          waitMins: 30,
          status: "Notified",
        },
        {
          id: 6,
          name: "Aisha Okonkwo",
          size: 2,
          waitMins: 12,
          status: "Waiting",
        },
        {
          id: 7,
          name: "Tom Herrera",
          size: 8,
          waitMins: 45,
          status: "Waiting",
        },
      ];

      // Status → pill class mapping (extend as needed)
      const statusClass = {
        Waiting: "status-confirmed",
        Notified: "status-pending",
        Seated: "status-seated",
      };

      // ── Render ────────────────────────────────────────────────────────────────
      function renderWaitlist(data) {
        const container = document.getElementById("waitlist-content");
        container.innerHTML = "";

        if (data.length === 0) {
          container.innerHTML = `<p class="text-muted p-3">No entries found.</p>`;
          return;
        }

        data.forEach(function (entry) {
          const row = document.createElement("div");
          row.className = "dashboard-table-row waitlist-table-row";
          row.dataset.id = entry.id;

          const pillClass = statusClass[entry.status] || "status-confirmed";

          row.innerHTML = `
            <div class="dashboard-table-cell waitlist-table-cell">
              <span class="guest-name">${entry.name}</span>
            </div>
            <div class="dashboard-table-cell waitlist-table-cell">${entry.size}</div>
            <div class="dashboard-table-cell waitlist-table-cell text-muted">${entry.waitMins} mins</div>
            <div class="dashboard-table-cell waitlist-table-cell">
              <span class="status-pill ${pillClass}">${entry.status}</span>
            </div>
            <div class="dashboard-table-cell waitlist-table-cell waitlist-cta-wrapper">
              <button class="btn btn-sm btn-outline-primary waitlist-seat-btn" onclick="notifyEntry(${entry.id})">Notify</button>
              <button class="btn btn-sm btn-primary ms-2 waitlist-seat-btn" onclick="seatEntry(${entry.id})">Seat</button>
            </div>
          `;

          container.appendChild(row);
        });
      }

      // ── Actions ───────────────────────────────────────────────────────────────
      function notifyEntry(id) {
        const entry = waitlistData.find(function (e) {
          return e.id === id;
        });
        if (!entry) return;
        entry.status = "Notified";
        renderWaitlist(getFiltered());
      }

      function seatEntry(id) {
        const idx = waitlistData.findIndex(function (e) {
          return e.id === id;
        });
        if (idx === -1) return;
        const name = waitlistData[idx].name;
        waitlistData.splice(idx, 1);
        renderWaitlist(getFiltered());
        alert(name + " has been seated!");
      }

      // ── Search ────────────────────────────────────────────────────────────────
      function getFiltered() {
        const query = document
          .getElementById("waitlist-search")
          .value.trim()
          .toLowerCase();
        if (!query) return waitlistData;
        return waitlistData.filter(function (e) {
          return e.name.toLowerCase().includes(query);
        });
      }

      document
        .getElementById("waitlist-search")
        .addEventListener("input", function () {
          renderWaitlist(getFiltered());
        });

      // ── Init ──────────────────────────────────────────────────────────────────
      renderWaitlist(waitlistData);
    </script>
  </body>
</html>
