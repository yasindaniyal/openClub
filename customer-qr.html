<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Reservation | OpenClub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <style>
      .reservation-card {
        max-width: 450px;
        margin: 60px auto;
        background: var(--color-bg-card);
        border: 1px solid var(--color-border);
        border-radius: 30px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      }

      .res-header {
        background: var(--color-accent);
        padding: 30px;
        text-align: center;
        color: white;
      }

      .res-body {
        padding: 40px;
        text-align: center;
      }

      .qr-container {
        background: white;
        padding: 20px;
        border-radius: 20px;
        display: inline-block;
        margin-bottom: 30px;
      }

      .res-info {
        margin-bottom: 30px;
        text-align: left;
      }

      .res-info-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--color-border);
        padding-bottom: 8px;
      }

      .res-info-item label {
        color: var(--color-text-muted);
        font-size: 14px;
      }

      .res-info-item span {
        color: white;
        font-weight: 600;
      }

      .status-banner {
        padding: 10px;
        background: rgba(16, 185, 129, 0.1);
        color: #10b981;
        border-radius: 12px;
        font-weight: 600;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body class="open-club">
    <div class="container">
      <div class="reservation-card">
        <div class="res-header">
          <h1 class="m-0 h3">Your Ticket</h1>
          <p class="m-0 small opacity-75">Club Aura - Houston, TX</p>
        </div>
        
        <div class="res-body">
          <div class="status-banner">Confirmed • Section Reserved</div>
          
          <div class="qr-container">
            <canvas id="qrcode"></canvas>
            <p class="mt-2 mb-0 text-dark small fw-bold">RES-4832-X</p>
          </div>
          
          <div class="res-info">
            <div class="res-info-item">
              <label>Guest</label>
              <span>John Smith</span>
            </div>
            <div class="res-info-item">
              <label>Section</label>
              <span>B3 (VIP Lounge)</span>
            </div>
            <div class="res-info-item">
              <label>Package</label>
              <span style="color: var(--color-accent)">Gold Package</span>
            </div>
            <div class="res-info-item">
              <label>Arrival</label>
              <span>Tonight, 8:30 PM</span>
            </div>
          </div>

          <div class="d-grid gap-2 mb-4">
             <button class="btn btn-primary py-3 rounded-pill" onclick="alert('Saving to Apple Wallet...')">Add to Apple Wallet</button>
             <button class="btn btn-outline-secondary py-3 rounded-pill text-white" onclick="alert('Sending to email...')">Email Ticket</button>
          </div>

          <p class="text-muted small">
            Please have this screen ready at the door. 
            Valid for May 14, 2026 only.
          </p>
        </div>
      </div>
    </div>

    <script>
      const resData = {
        id: "RES-4832-X",
        name: "John Smith",
        section: "B3",
        package: "Gold",
        timestamp: Date.now()
      };

      QRCode.toCanvas(document.getElementById('qrcode'), JSON.stringify(resData), {
        width: 200,
        margin: 0,
        color: {
          dark: '#000000',
          light: '#ffffff'
        }
      }, function (error) {
        if (error) console.error(error);
        console.log('QR code generated!');
      });
    </script>
  </body>
</html>
